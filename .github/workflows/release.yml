name: Release

# vX.Y 마일스톤의 이슈가 모두 닫히면 릴리즈 초안을 만들고, 마일스톤과 기획 이슈를 닫는다. 모델을 쓰지 않는다.
# 수동 실행하면 열린 마일스톤을 모두 확인한다. 흐름과 설정은 .github/planner/README.md.
on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  release:
    if: >-
      vars.PLANNER_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || github.event.issue.milestone != null
      )
    # 마지막 이슈 둘이 거의 같이 닫히면 두 실행이 같은 릴리즈 초안을 만들 수 있다.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 릴리즈 초안
        env:
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jobs=$(node scripts/planner/run.mts jobs release)
          echo "할 일: $jobs"
          while read -r job; do
            node scripts/planner/run.mts apply "$job" < /dev/null
          done < <(jq -c '.[]' <<<"$jobs")
