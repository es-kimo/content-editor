name: Agent implement

# 다음 이슈 하나를 골라 구현하고 PR을 연다. 열린 에이전트 PR이 있으면 아무것도 하지 않는다 (동시 1개).
# 에이전트 PR이 merge되거나, agent-ready가 달리거나, needs-human이 떨어지면 바로 다음 이슈를 고른다.
# 마일스톤 하나를 사람이 매번 돌리지 않고 끝까지 이어 가기 위해서다. cron은 한도로 멈춘 실행과 놓친 이벤트를 줍는다.
on:
  schedule:
    - cron: "*/30 * * * *"
  pull_request:
    types: [closed]
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "이슈 번호 (비우면 자동 선택)"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  # 한도에 걸려 멈춘 리뷰 실행을 다시 돌리는 데 쓴다 (gh run rerun).
  actions: write

env:
  REPO: ${{ github.repository }}
  # push·PR·라벨은 PAT로 한다. 기본 GITHUB_TOKEN으로 push하면 CI가 돌지 않는다.
  GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
  MAX_PRS: ${{ vars.AGENT_MAX_PRS_PER_NIGHT || '6' }}
  MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '2' }}
  AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
  EFFORT: ${{ vars.AGENT_EFFORT_IMPLEMENT || 'medium' }}
  # 리뷰 기준 스킬(review-kit). 구현 중 셀프 체크에 리뷰와 같은 기준을 쓴다.
  SKILLS_MARKETPLACE: ${{ vars.AGENT_SKILLS_MARKETPLACE || 'https://github.com/es-kimo/claude-skills.git' }}

jobs:
  implement:
    # 이슈 라벨이 바뀔 때마다 실행이 생기므로, 다음 이슈를 고를 이유가 있는 이벤트만 통과시킨다.
    if: >-
      vars.AGENT_ENABLED == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.merged &&
          contains(github.event.pull_request.labels.*.name, 'agent') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent-ready') ||
        (github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.label.name == 'needs-human')
      )
    # 워크플로 단위에 두면 if에서 걸러질 실행까지 줄을 서서, 기다리던 실행을 취소한다. 통과한 실행만 줄을 세운다.
    concurrency:
      group: agent-implement
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request 이벤트의 기본 ref는 PR의 merge ref다. 새 작업은 항상 main에서 시작한다.
          ref: main
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      - name: 다음 이슈 고르기
        id: pick
        run: |
          # 사용량 한도로 리뷰·수정이 멈춘 PR(agent-retry)은 마지막 리뷰 실행을 다시 돌린다.
          retry=$(gh pr list -R "$REPO" --label agent-retry --state open --json number,headRefName --jq '.[0] // empty')
          if [ -n "$retry" ]; then
            head=$(echo "$retry" | jq -r .headRefName)
            run=$(GH_TOKEN="${{ github.token }}" gh run list -R "$REPO" --workflow agent-review.yml --branch "$head" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run" ] && GH_TOKEN="${{ github.token }}" gh run rerun "$run" -R "$REPO"; then
              gh pr edit "$(echo "$retry" | jq -r .number)" -R "$REPO" --remove-label agent-retry
              echo "PR $(echo "$retry" | jq -r .number)의 리뷰 실행 $run 재시도"
            fi
            exit 0
          fi
          # 막혀서 사람을 기다리는 PR(needs-human)은 세지 않는다. 그 이슈는 PR이 열려 있는 동안 in progress라 다시 고르지 않고,
          # 그 이슈에 의존하지 않는 다음 이슈는 계속 진행한다.
          open=$(gh pr list -R "$REPO" --label agent --state open --json labels \
            --jq '[.[] | select(all(.labels[]; .name != "needs-human"))] | length')
          if [ "$open" != "0" ]; then echo "열린 에이전트 PR ${open}개 → 건너뜀"; exit 0; fi
          # 상한은 자동 실행(cron·이벤트)에 건다. 수동 실행은 사람이 보고 돌리는 것이라 막지 않는다.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            made=$(gh pr list -R "$REPO" --label agent --state all --search "created:>=$since" --json number --jq length)
            if [ "$made" -ge "$MAX_PRS" ]; then echo "최근 12시간 PR ${made}개, 상한 ${MAX_PRS} → 건너뜀"; exit 0; fi
          fi

          if [ -n "${{ inputs.issue }}" ]; then
            number="${{ inputs.issue }}"
          else
            number=$(node scripts/agent/pick-issue.mts | jq -r '.number // empty')
          fi
          if [ -z "$number" ]; then echo "고를 이슈 없음"; exit 0; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=agent/${number}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "이슈 #$number"

      - uses: pnpm/action-setup@v4
        if: steps.pick.outputs.number
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.number
        with:
          node-version: 22
          cache: pnpm
      - name: 준비
        if: steps.pick.outputs.number
        env:
          N: ${{ steps.pick.outputs.number }}
        run: |
          pnpm install --frozen-lockfile
          GITHUB_TOKEN="${{ secrets.FIXTURES_TOKEN || github.token }}" pnpm fixtures:sync
          mkdir -p .agent
          gh issue view "$N" -R "$REPO" --json title,body,comments \
            --jq '"# #\(env.N) \(.title)\n\n\(.body)\n\n## 코멘트\n" + ([.comments[] | "- \(.author.login): \(.body)"] | join("\n"))' > .agent/issue.md
          gh issue edit "$N" -R "$REPO" --add-label "in progress"
          # 이슈 본문은 설계를 PRD(wiki)에 맡기므로 wiki를 같이 넘긴다. 받지 못해도 실행은 계속한다.
          git clone --quiet --depth 1 "https://github.com/${REPO}.wiki.git" .agent/wiki \
            || echo "::warning::wiki를 받지 못했다"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이전 시도가 턴 한도 등으로 중간에 멈췄으면 그때 남긴 커밋(agent-wip/N)에서 이어 간다.
          if git fetch --quiet origin "agent-wip/$N" 2>/dev/null; then
            git switch -c "${{ steps.pick.outputs.branch }}" FETCH_HEAD
            { echo "# 이전 시도에서 이어 가기"; echo; echo "main 이후 이미 있는 커밋:"; echo; git log --format='- %h %s' origin/main..HEAD; } > .agent/resume.md
            echo "agent-wip/$N에서 이어 감 ($(git rev-list --count origin/main..HEAD)개 커밋)"
          else
            git switch -c "${{ steps.pick.outputs.branch }}"
          fi
          echo "schema=$(jq -c . .github/agent/schema-work.json)" >> "$GITHUB_ENV"

      - name: 구현 (Claude)
        id: claude
        if: steps.pick.outputs.number
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "`.github/agent/implement.md`의 지시를 따른다. 구현할 이슈는 `.agent/issue.md`에 있다."
          plugin_marketplaces: ${{ env.SKILLS_MARKETPLACE }}
          plugins: review-kit@es-kimo
          claude_args: >-
            --model ${{ env.AGENT_MODEL }}
            --fallback-model sonnet
            --effort ${{ env.EFFORT }}
            --max-turns 150
            --json-schema '${{ env.schema }}'
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Bash(git grep *),Bash(pnpm *),Bash(node *),Bash(git status),Bash(git status *),Bash(git diff *),Bash(git add *),Bash(git commit *),Bash(git log *),Bash(git show *),Bash(git rm *),Bash(git restore *),Bash(rm *),Bash(ls *)"
            --disallowedTools "Bash(pnpm fixtures:sync),Bash(pnpm fixtures:sync *)"

      - name: PR 열기 또는 실패 기록
        if: steps.pick.outputs.number
        env:
          N: ${{ steps.pick.outputs.number }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          commits=$(git rev-list --count origin/main..HEAD)
          info=$(node scripts/agent/classify-run.mts "$EXEC_FILE")
          kind=$(echo "$info" | jq -r .kind)
          models=$(echo "$info" | jq -r '.models | join(", ")')
          echo "실행 결과: $info"
          # action은 정상 종료도 턴 수를 잘못 비교해 실패로 끝내고 결과를 비운다 (classify.mts). 실행 기록이 정상 종료면 그 결과를 쓴다.
          if [ -z "$RESULT" ] && [ "$kind" = "ok" ]; then
            RESULT=$(echo "$info" | jq -c '.structured // empty')
            if [ -n "$RESULT" ]; then OUTCOME=success; fi
          fi
          RESULT="${RESULT:-null}"
          status=$(echo "$RESULT" | jq -r '.status // "failed"')

          # 사용량 한도는 시도 실패로 세지 않는다. 이슈를 비워 두고 다음 cron에서 다시 고른다.
          if [ "$kind" = "limit" ]; then
            echo "::warning::사용량 한도로 중단: $(echo "$info" | jq -r .detail)"
            gh issue edit "$N" -R "$REPO" --remove-label "in progress"
            exit 0
          fi

          # claude-code-action이 git 인증을 GITHUB_TOKEN으로 바꿔 두므로 push 전에 PAT로 되돌린다.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          reason=""
          if [ "$OUTCOME" = "success" ] && [ "$status" = "done" ] && [ "$commits" -gt 0 ]; then
            { echo "Closes #$N"; echo; echo "$RESULT" | jq -r '.summary'; echo; echo "---"; echo "에이전트 자동 생성 · 모델: ${models:-알 수 없음} · effort: $EFFORT · [실행 로그]($RUN_URL)"; } > .agent/pr.md
            if git push -u origin "$BRANCH" && gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "$(gh issue view "$N" -R "$REPO" --json title --jq .title)" \
              --body-file .agent/pr.md --label agent; then
              git push --quiet origin --delete "agent-wip/$N" 2>/dev/null || true
              exit 0
            fi
            reason="구현은 끝났지만 push 또는 PR 생성에 실패 (실행 로그 확인)"
          fi

          # 중간에 멈춘 작업을 버리지 않는다. 커밋하지 못한 변경까지 담아 agent-wip/N에 올리고 다음 시도가 이어 간다.
          # agent/ 접두사를 쓰지 않아 CI 가드와 리뷰 워크플로가 이 브랜치에 반응하지 않는다.
          wip=""
          if [ "$status" != "blocked" ]; then
            if [ -n "$(git status --porcelain)" ]; then
              git add -A && git commit --quiet -m "chore: 중단 시점의 미완 변경 자동 저장 (#$N)"
            fi
            if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ] && git push --quiet -f origin "HEAD:refs/heads/agent-wip/$N"; then
              wip="

          진행분은 \`agent-wip/$N\` 브랜치에 저장했다 (커밋 $(git rev-list --count origin/main..HEAD)개). 다음 시도는 여기서 이어 간다."
            fi
          fi

          [ -z "$reason" ] && reason=$(echo "$RESULT" | jq -r '.blocked_reason // .summary // empty')
          [ -z "$reason" ] && reason="Claude 단계 결과: ${OUTCOME} (${kind}), status: ${status}, 커밋 ${commits}개 · $(echo "$info" | jq -r .detail)"
          gh issue comment "$N" -R "$REPO" --body "<!-- agent:attempt-failed -->
          에이전트 구현 시도 실패 · [실행 로그]($RUN_URL)

          $reason$wip"
          gh issue edit "$N" -R "$REPO" --remove-label "in progress"
          failed=$(gh issue view "$N" -R "$REPO" --json comments --jq '[.comments[].body | select(contains("<!-- agent:attempt-failed -->"))] | length')
          if [ "$status" = "blocked" ] || [ "$failed" -ge "$MAX_ATTEMPTS" ]; then
            gh issue edit "$N" -R "$REPO" --add-label needs-human
          fi
