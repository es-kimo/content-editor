name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm fixtures:sync
        env:
          # yjshd(private) 픽스처는 FIXTURES_TOKEN 시크릿이 있을 때만 받는다. 없으면 blog만 받고 yjshd 테스트는 건너뛴다.
          GITHUB_TOKEN: ${{ secrets.FIXTURES_TOKEN || github.token }}
      - run: pnpm test
      - run: pnpm build

  # 빌드한 앱을 가짜 GitHub로 띄워 Chrome으로 확인한다. 에이전트가 실행마다 전체 e2e를 돌리지 않고, 리뷰는 이 결과를 근거로 쓴다.
  # ubuntu 러너에 설치된 Chrome을 쓴다 (e2e/app.ts의 channel: "chrome").
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e

  # 에이전트 PR(agent/ 브랜치)이 규칙 파일·워크플로·픽스처 설정을 바꾸거나 테스트를 꺼서 통과시키지 못하게 막는다.
  # 다른 PR에서는 바로 통과한다 (필수 체크로 걸기 위해 항상 실행한다).
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 에이전트 PR 금지 변경 검사
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          # eslint.config.mjs는 lint 기준이다. 에이전트가 기준을 낮춰 통과하지 못하게 한다.
          # docs/review/는 에이전트도 고칠 수 있고, 기준을 낮췄는지는 리뷰가 본다.
          bad=$(echo "$changed" | grep -E '^(\.github/|CLAUDE\.md$|AGENTS\.md$|fixtures\.config\.json$|scripts/sync-fixtures\.mts$|scripts/agent/|scripts/github-app/|github-app/|eslint\.config\.mjs$)' || true)
          disabled=$(git diff "$BASE"...HEAD -- '*.test.ts' '*.test.mts' | grep -E '^\+.*\b(test|it|describe)\.(skip|only|todo)\(' || true)
          if [ -n "$bad" ]; then echo "::error::에이전트 PR이 수정할 수 없는 파일:"; echo "$bad"; fi
          if [ -n "$disabled" ]; then echo "::error::새로 추가된 skip/only/todo:"; echo "$disabled"; fi
          [ -z "$bad" ] && [ -z "$disabled" ]
