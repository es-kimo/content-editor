name: Planner

# 기획자 에이전트(Codex). 사용자와 `planning` 이슈로 대화하고 아이디어 백로그·PRD(wiki)·작업 이슈·릴리즈를 관리한다.
# 모델은 wiki 폴더만 쓰고, GitHub 반영은 scripts/planner/run.mts가 한다. 설정과 사용법은 .github/planner/README.md.
on:
  issue_comment:
    types: [created]
  issues:
    # labeled는 받지 않는다. 기획자가 이슈를 만들 때 라벨 수만큼 실행이 생긴다.
    # 이미 있는 이슈에 planning을 달았으면 코멘트를 하나 달면 답한다.
    types: [opened, closed]
  schedule:
    # 월·목 09:00 KST. 진행 중인 작업이 없을 때만 제안 보고서를 올린다.
    - cron: "0 0 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "reply: 밀린 기획 이슈에 답 / propose: 제안 보고서"
        type: choice
        options: [reply, propose]
        default: reply

permissions:
  contents: read

env:
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  # 대화·제안(기획)은 Codex, 이슈 나누기(코드를 읽고 이슈를 쓰는 엔지니어링)는 구현과 같은 Claude, 릴리즈는 모델 없이.
  # GPT 구독(Plus) 사용량을 기획에만 쓰고, 여유 있는 Claude(Max) 구독으로 가장 비싼 이슈 나누기를 넘긴다.
  CODEX_MODEL: ${{ vars.PLANNER_MODEL || 'gpt-6-astra' }}
  CODEX_VERSION: "0.163.0"
  CLAUDE_MODEL: ${{ vars.PLANNER_CLAUDE_MODEL || vars.AGENT_MODEL || 'claude-opus-5-5' }}
  CLAUDE_VERSION: "2.1.303"
  # GitHub 러너에서 Codex 샌드박스가 돌지 않으면 danger-full-access로 바꾼다 (러너는 실행마다 버려진다).
  SANDBOX: ${{ vars.PLANNER_SANDBOX || 'workspace-write' }}
  PLANNER_DIR: ${{ github.workspace }}/.planner
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    # 소유자의 글에만 반응한다. public 레포라 누구나 코멘트할 수 있고, 기획자가 만든 agent-ready 이슈는 바로 구현된다.
    # 봇이 단 코멘트·라벨은 소유자 것이 아니라서 여기서 걸러진다.
    if: >-
      vars.PLANNER_ENABLED == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.issue.labels.*.name, 'planning')) ||
        (github.event_name == 'issues' && github.event.action != 'closed' &&
          github.event.sender.login == github.repository_owner &&
          contains(github.event.issue.labels.*.name, 'planning')) ||
        (github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.milestone != null)
      )
    # Codex 구독 토큰은 실행 중에 갱신되고, 갱신된 값을 시크릿에 되써야 한다. 실행이 겹치면 한쪽이 옛 토큰을 되쓰므로 하나씩 돈다.
    # 워크플로 단위에 두면 if에서 걸러질 실행까지 줄을 서서, 뒤에 온 무관한 실행이 기다리던 소유자 코멘트 실행을 취소한다.
    # job 단위에 두어 if를 통과한 실행만 줄을 세운다. 그래도 대기열에는 하나만 남지만, 실행마다 밀린 기획 이슈를 모두 훑으므로 답이 빠지지 않는다.
    concurrency:
      group: planner
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # 모델이 읽을 수 있는 작업 폴더에 토큰을 남기지 않는다.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 할 일 고르기
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MODE: ${{ inputs.mode }}
        run: |
          jobs=$(node scripts/planner/run.mts jobs)
          echo "할 일: $jobs"
          echo "list=$jobs" >> "$GITHUB_OUTPUT"

      - name: 준비
        id: prep
        if: steps.jobs.outputs.list != '[]'
        env:
          JOBS: ${{ steps.jobs.outputs.list }}
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p "$PLANNER_DIR"
          # 이번 할 일에 필요한 CLI만 설치한다. Codex 토큰도 Codex를 쓸 때만 꺼내므로 되쓰기도 그때만 돈다.
          if jq -e 'any(.[]; .mode == "converse" or .mode == "propose")' <<<"$JOBS" > /dev/null; then
            # ubuntu-24.04는 AppArmor가 일반 사용자의 user namespace 권한을 막아, Codex 샌드박스(bwrap)가
            # 네트워크를 만들다 `RTM_NEWADDR: Operation not permitted`로 실패한다. 러너는 실행마다 버려지므로 제한을 푼다.
            if [ "$SANDBOX" != "danger-full-access" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            npm install -g "@openai/codex@${CODEX_VERSION}"
            mkdir -p ~/.codex
            printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            echo "auth_sha=$(sha256sum ~/.codex/auth.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          if jq -e 'any(.[]; .mode == "breakdown")' <<<"$JOBS" > /dev/null; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
          fi

          gh label create planning -R "$REPO" --color 5319e7 --description "기획자와 대화하는 이슈" --force
          gh label create planner-report -R "$REPO" --color c5def5 --description "기획자 제안 보고서" --force
          gh label create prd-draft -R "$REPO" --color fbca04 --description "PRD 초안. 승인으로 시작하는 답을 달면 이슈를 만든다" --force
          gh label create issued -R "$REPO" --color 0e8a16 --description "PRD에서 작업 이슈를 만들었다" --force

          git clone --quiet "https://github.com/${REPO}.wiki.git" "$PLANNER_DIR/wiki"
          bot=$(gh api user --jq '"\(.login) \(.id)"')
          git -C "$PLANNER_DIR/wiki" config user.name "${bot% *}"
          git -C "$PLANNER_DIR/wiki" config user.email "${bot#* }+${bot% *}@users.noreply.github.com"

      - name: 기획
        if: steps.jobs.outputs.list != '[]'
        env:
          JOBS: ${{ steps.jobs.outputs.list }}
          BOT_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EFFORT_CONVERSE: ${{ vars.PLANNER_EFFORT_CONVERSE || 'medium' }}
          EFFORT_BREAKDOWN: ${{ vars.PLANNER_EFFORT_BREAKDOWN || 'high' }}
          EFFORT_PROPOSE: ${{ vars.PLANNER_EFFORT_PROPOSE || 'medium' }}
        run: |
          # wiki push 인증은 명령마다 헤더로 넘긴다. remote URL이나 git config에 두면 모델이 읽을 수 있다.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)"
          wiki="$PLANNER_DIR/wiki"
          failed=0

          # 모델을 돌려 $PLANNER_DIR/out.json을 만든다. 반복문의 stdin(할 일 목록)을 모델이 프롬프트로 읽지 않게 /dev/null을 준다.
          think() {
            local prompt="\`../.github/planner/role.md\`를 읽고 따른다. 이번 모드는 \`$mode\`이고 지시는 \`../.github/planner/$mode.md\`에 있다. 입력은 \`context.md\`에 있다."
            local schema="$GITHUB_WORKSPACE/.github/planner/schema-$mode.json"
            if [ "$mode" = "breakdown" ]; then
              # Bash는 검색만 허용한다. 레포 코드는 --add-dir로 읽고, 쓰기는 wiki만 저장된다.
              (cd "$PLANNER_DIR" && env -u BOT_TOKEN -u GH_TOKEN claude -p "$prompt" \
                --model "$model" --fallback-model sonnet --effort "$effort" --max-turns 80 \
                --output-format json --json-schema "$(jq -c . "$schema")" \
                --permission-mode acceptEdits --add-dir "$GITHUB_WORKSPACE" \
                --allowedTools "Read,Glob,Grep,Edit,Write,Bash(rg *),Bash(ls *)" \
                < /dev/null > "$PLANNER_DIR/claude.json") || return 1
              jq -c '{subtype, num_turns, usage: (.usage | {input_tokens, output_tokens, cache_read_input_tokens, cache_creation_input_tokens})}' "$PLANNER_DIR/claude.json"
              jq -e '.structured_output // empty' "$PLANNER_DIR/claude.json" > "$PLANNER_DIR/out.json"
            else
              # 레포 AGENTS.md는 개발 에이전트용이라 읽지 않는다(project_doc_max_bytes=0).
              env -u BOT_TOKEN -u GH_TOKEN -u CLAUDE_CODE_OAUTH_TOKEN codex exec \
                --cd "$PLANNER_DIR" \
                --model "$model" \
                --config "model_reasoning_effort=\"$effort\"" \
                --config "project_doc_max_bytes=0" \
                --sandbox "$SANDBOX" \
                --ephemeral \
                --output-schema "$schema" \
                --output-last-message "$PLANNER_DIR/out.json" \
                "$prompt" < /dev/null \
                && jq -e . "$PLANNER_DIR/out.json" > /dev/null
            fi
          }

          while read -r job; do
            mode=$(jq -r .mode <<<"$job")
            case "$mode" in
              converse) model=$CODEX_MODEL effort=$EFFORT_CONVERSE ;;
              propose) model=$CODEX_MODEL effort=$EFFORT_PROPOSE ;;
              breakdown) model=$CLAUDE_MODEL effort=$EFFORT_BREAKDOWN ;;
              release) model="" effort="" ;;
            esac
            echo "::group::$job ${model:+($model, effort $effort)}"
            if [ "$mode" = "release" ]; then
              # 릴리즈 노트는 마일스톤 이슈와 그 PR로 만든다. 모델을 쓰지 않는다.
              GH_TOKEN="$BOT_TOKEN" node scripts/planner/run.mts apply "$job" < /dev/null || failed=1
              echo "::endgroup::"
              continue
            fi

            git -C "$wiki" reset --quiet --hard && git -C "$wiki" clean -fdq
            rm -f "$PLANNER_DIR/out.json"
            GH_TOKEN="$BOT_TOKEN" node scripts/planner/run.mts context "$job" < /dev/null
            if think; then
              msg=$(jq -r 'select(.status == "done") | .wiki_message // empty' "$PLANNER_DIR/out.json")
              if [ -n "$msg" ] && [ -n "$(git -C "$wiki" status --porcelain)" ]; then
                git -C "$wiki" add -A
                git -C "$wiki" commit --quiet -m "$msg"
                git -C "$wiki" -c http.extraheader="$auth" push --quiet
              fi
              if ! GH_TOKEN="$BOT_TOKEN" MODEL="$model" EFFORT="$effort" node scripts/planner/run.mts apply "$job" "$PLANNER_DIR/out.json" < /dev/null; then
                failed=1
                GH_TOKEN="$BOT_TOKEN" MODEL="$model" EFFORT="$effort" node scripts/planner/run.mts fail "$job" "$PLANNER_DIR/out.json" < /dev/null || true
              fi
            else
              failed=1
              GH_TOKEN="$BOT_TOKEN" MODEL="$model" EFFORT="$effort" node scripts/planner/run.mts fail "$job" "$PLANNER_DIR/out.json" < /dev/null || true
            fi
            echo "::endgroup::"
          done < <(jq -c '.[]' <<<"$JOBS")
          exit $failed

      - name: Codex 토큰 되쓰기
        if: always() && steps.prep.outputs.auth_sha
        env:
          GH_TOKEN: ${{ secrets.PLANNER_SECRETS_TOKEN }}
          BEFORE: ${{ steps.prep.outputs.auth_sha }}
        run: |
          # 갱신된 토큰을 되쓰지 않으면 시크릿의 옛 refresh token이 무효가 되어 다음 실행부터 로그인이 깨질 수 있다.
          if [ "$(sha256sum ~/.codex/auth.json | cut -d' ' -f1)" != "$BEFORE" ]; then
            gh secret set CODEX_AUTH_JSON -R "$REPO" < ~/.codex/auth.json
            echo "CODEX_AUTH_JSON 갱신"
          else
            echo "토큰 변화 없음"
          fi
          rm -f ~/.codex/auth.json
