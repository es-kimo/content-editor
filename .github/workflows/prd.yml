name: PRD

# 기획자(Codex)가 기획 원문 이슈(planning)를 버전 PRD 초안(wiki)으로 정리하고, 소유자 코멘트대로 고친다.
# 승인 뒤 이슈 나누기는 breakdown.yml, 릴리즈 초안은 release.yml이 한다. 모델은 wiki 폴더만 쓰고, GitHub 반영은 scripts/planner/run.mts가 한다.
# 흐름과 설정은 .github/planner/README.md.
on:
  issues:
    # opened는 받지 않는다. 템플릿으로 열어도 planning이 붙으면서 labeled가 오고, 이미 있는 이슈에 planning을 달아도 시작된다.
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  CODEX_MODEL: ${{ vars.PLANNER_MODEL || 'gpt-6-astra' }}
  CODEX_VERSION: "0.163.0"
  # GitHub 러너에서 Codex 샌드박스가 돌지 않으면 danger-full-access로 바꾼다 (러너는 실행마다 버려진다).
  SANDBOX: ${{ vars.PLANNER_SANDBOX || 'workspace-write' }}
  PLANNER_DIR: ${{ github.workspace }}/.planner
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prd:
    # 소유자의 라벨·코멘트에만 반응한다. public 레포라 누구나 코멘트할 수 있고, 승인된 PRD는 작업 이슈가 되어 그날 밤 구현된다.
    # 봇이 단 코멘트·라벨은 소유자 것이 아니라서 여기서 걸러진다.
    # 승인 코멘트에도 이 실행이 뜨지만, 할 일 고르기에서 breakdown 몫이라 빠진다. 말뜻은 scripts/planner/plan.mts의 isApproval 하나로 판단한다.
    if: >-
      vars.PLANNER_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && github.event.label.name == 'planning' &&
          github.event.sender.login == github.repository_owner) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.issue.labels.*.name, 'planning') &&
          !contains(github.event.issue.labels.*.name, 'issued'))
      )
    # Codex 구독 토큰은 실행 중에 갱신되고, 갱신된 값을 시크릿에 되써야 한다. 실행이 겹치면 한쪽이 옛 토큰을 되쓰므로 하나씩 돈다.
    # 워크플로 단위에 두면 if에서 걸러질 실행까지 줄을 서서, 뒤에 온 무관한 실행이 기다리던 소유자 코멘트 실행을 취소한다.
    # job 단위에 두어 if를 통과한 실행만 줄을 세운다. 그래도 대기열에는 하나만 남지만, 실행마다 밀린 기획 이슈를 모두 훑으므로 답이 빠지지 않는다.
    concurrency:
      group: prd
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # 모델이 읽을 수 있는 작업 폴더에 토큰을 남기지 않는다.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 할 일 고르기
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
        run: |
          jobs=$(node scripts/planner/run.mts jobs prd)
          echo "할 일: $jobs"
          echo "list=$jobs" >> "$GITHUB_OUTPUT"

      - name: 준비
        id: prep
        if: steps.jobs.outputs.list != '[]'
        env:
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          # ubuntu-24.04는 AppArmor가 일반 사용자의 user namespace 권한을 막아, Codex 샌드박스(bwrap)가
          # 네트워크를 만들다 `RTM_NEWADDR: Operation not permitted`로 실패한다. 러너는 실행마다 버려지므로 제한을 푼다.
          if [ "$SANDBOX" != "danger-full-access" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install -g "@openai/codex@${CODEX_VERSION}"
          mkdir -p ~/.codex "$PLANNER_DIR"
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          echo "auth_sha=$(sha256sum ~/.codex/auth.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          gh label create planning -R "$REPO" --color 5319e7 --description "기획 원문. 소유자가 달면 기획자가 PRD 초안을 쓴다" --force
          gh label create prd-draft -R "$REPO" --color fbca04 --description "PRD 초안 검토 중. 코멘트로 고치고, 승인으로 시작하는 코멘트를 달면 작업 이슈로 나눈다" --force
          bash scripts/planner/wiki.sh clone

      - name: PRD 쓰기
        if: steps.jobs.outputs.list != '[]'
        env:
          JOBS: ${{ steps.jobs.outputs.list }}
          GH_TOKEN: ${{ secrets.PLANNER_GH_TOKEN }}
          MODEL: ${{ env.CODEX_MODEL }}
          EFFORT: ${{ vars.PLANNER_EFFORT_PRD || 'medium' }}
        run: |
          prompt="\`../.github/planner/role.md\`를 읽고 따른다. 이번 모드는 \`prd\`이고 지시는 \`../.github/planner/prd.md\`에 있다. 입력은 \`context.md\`에 있다."
          out="$PLANNER_DIR/out.json"
          failed=0
          # 반복문의 stdin(할 일 목록)을 명령이 읽지 않게 /dev/null을 준다. 모델이 읽으면 프롬프트로 들어간다.
          while read -r job; do
            echo "::group::$job ($MODEL, effort $EFFORT)"
            bash scripts/planner/wiki.sh reset < /dev/null
            rm -f "$out"
            node scripts/planner/run.mts context "$job" < /dev/null
            # 레포 AGENTS.md는 개발 에이전트용이라 읽지 않는다(project_doc_max_bytes=0).
            if env -u GH_TOKEN codex exec \
              --cd "$PLANNER_DIR" \
              --model "$MODEL" \
              --config "model_reasoning_effort=\"$EFFORT\"" \
              --config "project_doc_max_bytes=0" \
              --sandbox "$SANDBOX" \
              --ephemeral \
              --output-schema "$GITHUB_WORKSPACE/.github/planner/schema-prd.json" \
              --output-last-message "$out" \
              "$prompt" < /dev/null && jq -e . "$out" > /dev/null; then
              msg=$(jq -r 'select(.status == "done") | .wiki_message // empty' "$out")
              if [ -n "$msg" ]; then bash scripts/planner/wiki.sh push "$msg" < /dev/null; fi
              if ! node scripts/planner/run.mts apply "$job" "$out" < /dev/null; then
                failed=1
                node scripts/planner/run.mts fail "$job" "$out" < /dev/null || true
              fi
            else
              failed=1
              node scripts/planner/run.mts fail "$job" "$out" < /dev/null || true
            fi
            echo "::endgroup::"
          done < <(jq -c '.[]' <<<"$JOBS")
          exit $failed

      - name: Codex 토큰 되쓰기
        if: always() && steps.prep.outputs.auth_sha
        env:
          GH_TOKEN: ${{ secrets.PLANNER_SECRETS_TOKEN }}
          BEFORE: ${{ steps.prep.outputs.auth_sha }}
        run: |
          # 갱신된 토큰을 되쓰지 않으면 시크릿의 옛 refresh token이 무효가 되어 다음 실행부터 로그인이 깨질 수 있다.
          if [ "$(sha256sum ~/.codex/auth.json | cut -d' ' -f1)" != "$BEFORE" ]; then
            gh secret set CODEX_AUTH_JSON -R "$REPO" < ~/.codex/auth.json
            echo "CODEX_AUTH_JSON 갱신"
          else
            echo "토큰 변화 없음"
          fi
          rm -f ~/.codex/auth.json
