name: Agent review

# 에이전트 PR의 CI가 끝나면 돈다.
# - CI 실패: 로그를 주고 수정 → push → CI 재실행
# - CI 통과: 독립 리뷰 → 승인이면 auto-merge, 수정 요청이면 수정 → push → CI 재실행
# 수정 횟수가 상한을 넘으면 needs-human을 달고 멈춘다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: agent-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  MAX_FIX: ${{ vars.AGENT_MAX_FIX || '2' }}
  AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
  EFFORT_REVIEW: ${{ vars.AGENT_EFFORT_REVIEW || 'high' }}
  EFFORT_FIX: ${{ vars.AGENT_EFFORT_FIX || 'medium' }}
  # 리뷰 기준 스킬(review-kit). 레포에 따라 달라지지 않는 기준이라 별도 레포의 플러그인으로 받는다.
  SKILLS_MARKETPLACE: ${{ vars.AGENT_SKILLS_MARKETPLACE || 'https://github.com/es-kimo/claude-skills.git' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  review:
    # 포크 PR이 agent/ 브랜치 이름을 써도 돌지 않게 같은 레포만 허용한다.
    if: >-
      vars.AGENT_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: PR 찾기
        id: pr
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --label agent --json number,headRefOid,body --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "열린 에이전트 PR 없음"; exit 0; fi
          if [ "$(echo "$pr" | jq -r .headRefOid)" != "$HEAD_SHA" ]; then echo "이미 새 커밋이 있음 → 이번 CI 결과는 건너뜀"; exit 0; fi
          echo "number=$(echo "$pr" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "issue=$(echo "$pr" | jq -r .body | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.number
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: steps.pr.outputs.number
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number
        with:
          node-version: 22
          cache: pnpm

      - name: 준비
        id: prep
        if: steps.pr.outputs.number
        env:
          PR: ${{ steps.pr.outputs.number }}
          ISSUE: ${{ steps.pr.outputs.issue }}
        run: |
          pnpm install --frozen-lockfile
          GITHUB_TOKEN="${{ secrets.FIXTURES_TOKEN || github.token }}" pnpm fixtures:sync
          mkdir -p .agent
          gh issue view "$ISSUE" -R "$REPO" --json title,body \
            --jq '"# #\(env.ISSUE) \(.title)\n\n\(.body)"' > .agent/issue.md
          gh pr view "$PR" -R "$REPO" --json body --jq .body > .agent/pr.md
          # 이슈 본문은 설계를 PRD(wiki)에 맡기므로 wiki를 같이 넘긴다. 받지 못해도 실행은 계속한다.
          git clone --quiet --depth 1 "https://github.com/${REPO}.wiki.git" .agent/wiki \
            || echo "::warning::wiki를 받지 못했다"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fixes=$(gh pr view "$PR" -R "$REPO" --json comments --jq '[.comments[].body | select(contains("<!-- agent:fix -->"))] | length')
          echo "fixes=$fixes" >> "$GITHUB_OUTPUT"
          echo "review_schema=$(jq -c . .github/agent/schema-review.json)" >> "$GITHUB_ENV"
          echo "work_schema=$(jq -c . .github/agent/schema-work.json)" >> "$GITHUB_ENV"
          if [ "$CI_CONCLUSION" = "success" ]; then
            git diff origin/main...HEAD > .agent/diff.patch
            echo "mode=review" >> "$GITHUB_OUTPUT"
          else
            { echo "# CI 실패 로그 (마지막 300줄)"; echo; echo '```'; GH_TOKEN="${{ github.token }}" gh run view "$CI_RUN_ID" -R "$REPO" --log-failed | tail -n 300; echo '```'; } > .agent/feedback.md
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          fi

      - name: 리뷰 (Claude)
        id: review
        if: steps.prep.outputs.mode == 'review'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "`.github/agent/review.md`의 지시를 따른다. 이슈는 `.agent/issue.md`, PR 본문은 `.agent/pr.md`, 변경은 `.agent/diff.patch`에 있다."
          plugin_marketplaces: ${{ env.SKILLS_MARKETPLACE }}
          plugins: review-kit@es-kimo
          claude_args: >-
            --model ${{ env.AGENT_MODEL }}
            --fallback-model sonnet
            --effort ${{ env.EFFORT_REVIEW }}
            --max-turns 60
            --json-schema '${{ env.review_schema }}'
            --allowedTools "Read,Glob,Grep,Skill,Bash(git grep *),Bash(pnpm test),Bash(pnpm test *),Bash(pnpm lint),Bash(pnpm format:check),Bash(pnpm typecheck),Bash(pnpm build),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(ls *)"
            --disallowedTools "Edit,Write,Bash(pnpm fixtures:sync),Bash(pnpm fixtures:sync *)"

      - name: 리뷰 결과 처리
        id: verdict
        if: steps.prep.outputs.mode == 'review'
        env:
          PR: ${{ steps.pr.outputs.number }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          RESULT: ${{ steps.review.outputs.structured_output }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          FIXES: ${{ steps.prep.outputs.fixes }}
        run: |
          RESULT="${RESULT:-null}"
          info=$(node scripts/agent/classify-run.mts "$EXEC_FILE")
          echo "실행 결과: $info"
          if ! echo "$RESULT" | jq -e '(.criteria | length) > 0 and (.findings | type) == "array"' > /dev/null 2>&1; then
            if [ "$(echo "$info" | jq -r .kind)" = "limit" ]; then
              # 한도는 사람 확인 대상이 아니다. 다음 cron이 이 리뷰 실행을 다시 돌린다.
              gh pr edit "$PR" -R "$REPO" --add-label agent-retry
              exit 0
            fi
            gh pr comment "$PR" -R "$REPO" --body "<!-- agent:review-error -->
          리뷰 단계가 결과를 내지 못함 ($(echo "$info" | jq -r '"\(.kind): \(.detail)"')) · [실행 로그]($RUN_URL)"
            gh pr edit "$PR" -R "$REPO" --add-label needs-human
            exit 0
          fi
          # 판정은 모델이 아니라 여기서 정한다. blocking이 하나라도 있거나 완료 기준 하나라도 미충족이면 수정 요청이다.
          blocking=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "blocking")] | length')
          unmet=$(echo "$RESULT" | jq '[.criteria[] | select(.met | not)] | length')
          suggestions=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "suggestion")] | length')
          if [ "$blocking" -eq 0 ] && [ "$unmet" -eq 0 ]; then verdict=approve; title="승인"; else verdict=request_changes; title="수정 요청"; fi
          render='
            {correctness: "정확성", maintainability: "유지보수", test: "테스트", design: "화면", scope: "범위", writing: "글"} as $label
            | def loc: "`\(.file)\(if .line then ":\(.line)" else "" end)`";
            def blocking: [.findings[] | select(.severity == "blocking")];
            def suggestions: [.findings[] | select(.severity == "suggestion")];
            (.summary), "",
            "**완료 기준**",
            (.criteria[] | "- [\(if .met then "x" else " " end)] \(.criterion) — \(.evidence)"),
            (if (blocking | length) > 0 then
              "", "**고칠 것**",
              (blocking | to_entries[] | "\(.key + 1). **[\($label[.value.category])] \(.value.title)** · \(.value | loc)\n   \(.value.problem)\n   → \(.value.fix)")
            else empty end),
            (if (suggestions | length) > 0 then
              "", "<details><summary>제안 \(suggestions | length)건 (merge를 막지 않음)</summary>", "",
              (suggestions[] | "- **[\($label[.category])] \(.title)** · \(loc) — \(.problem) → \(.fix)"),
              "", "</details>"
            else empty end)'
          {
            echo "<!-- agent:review-$verdict -->"
            echo "## 에이전트 리뷰: $title (blocking ${blocking} · 미충족 기준 ${unmet} · 제안 ${suggestions})"; echo
            echo "$RESULT" | jq -r "$render"
            echo; echo "모델: $(echo "$info" | jq -r '.models | join(", ")') · effort: $EFFORT_REVIEW · [실행 로그]($RUN_URL)"
          } > .agent/review.md
          gh pr comment "$PR" -R "$REPO" --body-file .agent/review.md

          if [ "$verdict" = "approve" ]; then
            gh pr merge "$PR" -R "$REPO" --auto --merge --delete-branch
            # merge되면 이슈가 닫힌다. 진행 중 라벨은 여기서 정리한다.
            gh issue edit "$ISSUE" -R "$REPO" --remove-label "in progress" || true
            exit 0
          fi
          if [ "$FIXES" -ge "$MAX_FIX" ]; then
            gh pr comment "$PR" -R "$REPO" --body "수정 ${FIXES}회 후에도 리뷰를 통과하지 못해 멈춤. 사람 확인 필요."
            gh pr edit "$PR" -R "$REPO" --add-label needs-human
            gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human
            exit 0
          fi
          # 수정 에이전트에는 blocking과 미충족 기준만 넘긴다. 제안까지 넘기면 범위가 늘고 수정 횟수를 소모한다.
          {
            echo "# 리뷰 지적 (blocking)"; echo
            echo "$RESULT" | jq -r '.findings[] | select(.severity == "blocking") | "- [\(.category)] \(.file)\(if .line then ":\(.line)" else "" end): \(.title)\n  \(.problem)\n  수정: \(.fix)"'
            echo; echo "# 충족되지 않은 완료 기준"; echo
            echo "$RESULT" | jq -r '.criteria[] | select(.met | not) | "- \(.criterion): \(.evidence)"'
          } > .agent/feedback.md
          echo "fix=true" >> "$GITHUB_OUTPUT"

      - name: CI 실패 수정 한도 확인
        id: cigate
        if: steps.prep.outputs.mode == 'fix'
        env:
          PR: ${{ steps.pr.outputs.number }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          FIXES: ${{ steps.prep.outputs.fixes }}
        run: |
          if [ "$FIXES" -ge "$MAX_FIX" ]; then
            gh pr comment "$PR" -R "$REPO" --body "수정 ${FIXES}회 후에도 CI가 실패해 멈춤. 사람 확인 필요 · [CI 로그](${{ github.event.workflow_run.html_url }})"
            gh pr edit "$PR" -R "$REPO" --add-label needs-human
            gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human
            exit 0
          fi
          echo "fix=true" >> "$GITHUB_OUTPUT"

      - name: 수정 (Claude)
        id: fix
        if: steps.verdict.outputs.fix == 'true' || steps.cigate.outputs.fix == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "`.github/agent/fix.md`의 지시를 따른다. 이슈는 `.agent/issue.md`, 고칠 내용은 `.agent/feedback.md`에 있다."
          plugin_marketplaces: ${{ env.SKILLS_MARKETPLACE }}
          plugins: review-kit@es-kimo
          claude_args: >-
            --model ${{ env.AGENT_MODEL }}
            --fallback-model sonnet
            --effort ${{ env.EFFORT_FIX }}
            --max-turns 60
            --json-schema '${{ env.work_schema }}'
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Bash(git grep *),Bash(pnpm *),Bash(node *),Bash(git status),Bash(git status *),Bash(git diff *),Bash(git add *),Bash(git commit *),Bash(git log *),Bash(git show *),Bash(git rm *),Bash(git restore *),Bash(rm *),Bash(ls *)"
            --disallowedTools "Bash(pnpm fixtures:sync),Bash(pnpm fixtures:sync *)"

      - name: 수정 push
        if: steps.verdict.outputs.fix == 'true' || steps.cigate.outputs.fix == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          RESULT: ${{ steps.fix.outputs.structured_output }}
          OUTCOME: ${{ steps.fix.outcome }}
          EXEC_FILE: ${{ steps.fix.outputs.execution_file }}
        run: |
          RESULT="${RESULT:-null}"
          status=$(echo "$RESULT" | jq -r '.status // "failed"')
          new=$(git rev-list --count "$HEAD_SHA"..HEAD)
          info=$(node scripts/agent/classify-run.mts "$EXEC_FILE")
          echo "실행 결과: $info"
          if [ "$(echo "$info" | jq -r .kind)" = "limit" ]; then
            gh pr edit "$PR" -R "$REPO" --add-label agent-retry
            exit 0
          fi
          reason=""
          if [ "$OUTCOME" = "success" ] && [ "$status" = "done" ] && [ "$new" -gt 0 ]; then
            # claude-code-action이 git 인증을 GITHUB_TOKEN으로 바꿔 두므로 push 전에 PAT로 되돌린다.
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            if git push origin "HEAD:$BRANCH"; then
              gh pr comment "$PR" -R "$REPO" --body "<!-- agent:fix -->
          ## 에이전트 수정

          $(echo "$RESULT" | jq -r '.summary')

          모델: $(echo "$info" | jq -r '.models | join(", ")') · effort: $EFFORT_FIX · [실행 로그]($RUN_URL)"
              exit 0
            fi
            reason="수정은 끝났지만 push에 실패 (실행 로그 확인)"
          fi
          [ -z "$reason" ] && reason=$(echo "$RESULT" | jq -r '.blocked_reason // .summary // empty')
          gh pr comment "$PR" -R "$REPO" --body "<!-- agent:fix-failed -->
          수정 실패 (status: ${status}, 결과: ${OUTCOME}, $(echo "$info" | jq -r .kind), 새 커밋 ${new}개) · [실행 로그]($RUN_URL)

          ${reason}"
          gh pr edit "$PR" -R "$REPO" --add-label needs-human
          gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human
